name: Verify restored data

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to restore and verify
        required: true
        default: market-data-1m-2026-11-15
        type: string
      destination:
        description: Workspace-relative directory for the restored tree
        required: true
        default: data/restored
        type: string
      rate_window:
        description: Extraction rate smoothing window in seconds
        required: true
        default: "30"
        type: string
      report:
        description: Workspace-relative path for the JSON report
        required: true
        default: ci-artifacts/verification.json
        type: string

permissions:
  contents: write

concurrency:
  group: verify-restored-data
  cancel-in-progress: false

jobs:
  verify:
    name: Restore and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore cached release parts
        id: release-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: release-assets
          key: release-parts-v1-${{ inputs.tag }}-${{ hashFiles('data/releases/*.sha256') }}
      - name: Download and verify release parts
        id: download-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -o pipefail
          python -m scripts.restore_market_data \
            --download \
            --tag "$RELEASE_TAG" \
            --verify-only
      - name: Save release parts cache
        if: steps.download-release.outcome == 'success' && steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: release-assets
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - name: Restore release
        id: restore-release
        shell: bash
        env:
          RESTORE_DEST: ${{ inputs.destination }}
          RATE_WINDOW: ${{ inputs.rate_window }}
        run: |
          set -o pipefail
          python -m scripts.restore_market_data \
            --archive-dir release-assets \
            --dest "$RESTORE_DEST" \
            --rate-window "$RATE_WINDOW" \
            --remove-archive
      - name: Verify restored tree
        id: verify-restored
        if: always()
        shell: bash
        env:
          RESTORE_DEST: ${{ inputs.destination }}
          REPORT_PATH: ${{ inputs.report }}
        run: |
          set -o pipefail
          python -m scripts.restore_market_data \
            --verify-restored \
            --archive-dir release-assets \
            --dest "$RESTORE_DEST" \
            --report "$REPORT_PATH"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-tree-verification
          path: ${{ inputs.report }}
          if-no-files-found: error
          retention-days: 30
      - name: Write run summary
        id: write_summary
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.release-cache.outputs.cache-hit }}
          CACHE_OUTCOME: ${{ steps.release-cache.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-restored.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$CACHE_HIT" == "true" ]]; then
            cache_status="hit"
          elif [[ "$CACHE_OUTCOME" == "success" ]]; then
            cache_status="miss"
          else
            cache_status="unavailable (${CACHE_OUTCOME:-not run})"
          fi
          {
            echo "## Restore verification"
            echo
            echo "| Item | Status |"
            echo "| --- | --- |"
            echo "| Release-parts cache | $cache_status |"
            echo "| Final verification | ${VERIFY_OUTCOME:-not run} |"
            echo "| Verification run | [#${GITHUB_RUN_NUMBER}]($RUN_URL) |"
            echo "| Generated at | $timestamp |"
          } | tee "$RUNNER_TEMP/restore-summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload run summary
        if: always() && steps.write_summary.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: restore-summary
          path: ${{ runner.temp }}/restore-summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish run summary to release
        if: always() && steps.write_summary.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/restore-summary.md" --clobber
